  from = "/checkout"
  to   = "/checkout.html"
  status = 200

[[redirects]]
  from = "/success"
  to   = "/success.html"
  status = 200

[[redirects]]
  from = "/organiser"
  to   = "/organiser.html"
  status = 200

[[redirects]]
  from = "/my-tickets"
  to   = "/my-tickets.html"
  status = 200

[[redirects]]
  from = "/auth-callback"
  to   = "/auth-callback.html"
  status = 200

[[redirects]]
  from = "/accommodations"
  to   = "/accommodations.html"
