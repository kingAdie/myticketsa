[build]
  publish   = "frontend"
  functions = "netlify/functions"

# ── Cache headers ────────────────────────────────────────
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag          = "index, follow"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/success.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/checkout.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── Images: long cache ────────────────────────────────────
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Sitemap & robots ─────────────────────────────────────
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type  = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type  = "text/plain"
    Cache-Control = "public, max-age=86400"

# ── Strip .html extension from all URLs (clean URLs) ──────
[[redirects]]
  from   = "/*.html"
  to     = "/:splat"
  status = 301
  force  = true

# ── Clean URL rewrites serve the right .html file ───────
[[redirects]]
  from = "/event"
  to   = "/event.html"
  status = 200

# /events had pointed at events.html, which does not exist it 404'd.
# Browse is the real listing page.
[[redirects]]
  from = "/events"
  to   = "/browse.html"
  status = 200

[[redirects]]
  from = "/top32-venda"
  to   = "/top32-venda.html"
  status = 200

[[redirects]]
  from = "/browse"
  to   = "/browse.html"
  status = 200

[[redirects]]
  from = "/experiences"
  to   = "/browse.html?category=Travel%20%26%20Tours"
  status = 200

# ── Selling ───────────────────────────────────────────────
[[redirects]]
  from = "/sell"
  to   = "/sell.html"
  status = 200

[[redirects]]
  from = "/create-listing"
  to   = "/create-listing.html"
  status = 200

# Pretty /sell/<category> URLs served by the flat sell-<category>.html files
[[redirects]]
  from = "/sell/event"
  to   = "/sell-event.html"
  status = 200

[[redirects]]
  from = "/sell/accommodation"
  to   = "/sell-accommodation.html"
  status = 200

[[redirects]]
  from = "/sell/experience"
  to   = "/sell-experience.html"
  status = 200

[[redirects]]
  from = "/sell/equipment"
  to   = "/sell-equipment.html"
  status = 200

[[redirects]]
  from = "/sell/merchandise"
  to   = "/sell-merchandise.html"
  status = 200

# The strip-.html rule above rewrites sell-event.html → /sell-event,
