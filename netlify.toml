[build]
  publish = "frontend"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Proxy all /api calls through Netlify to avoid CORS on the browser side
[[redirects]]
  from   = "/api/*"
  to     = "https://myticketsa-production.up.railway.app/api/:splat"
  status = 200
  force  = true
