[build]
  command   = "npm install"
  publish   = "frontend"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ── Cache headers ─────────────────────────────────
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options      = "DENY"
    X-Content-Type-Options = "nosniff"

# ── API → Netlify Function ────────────────────────
# All /api/* requests are handled by the Express function.
# No more Railway proxy.
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

# ── Frontend SPA fallback ─────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
