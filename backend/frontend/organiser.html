<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Events — MyTicketSA</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
  <link rel="stylesheet" href="css/organiser.css"/>
  <meta property="og:title" content="Organiser Dashboard — MyTicketSA"/>
  <meta property="og:description" content="Manage your events on MyTicketSA."/>
  <meta property="og:type" content="website"/>
  <meta name="theme-color" content="#0B0B0B"/>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟</text></svg>"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="container navbar__inner">
      <a href="index.html" class="navbar__logo">
        <div class="navbar__logo-wordmark">
          <span class="w-my">my</span><span class="w-ticket">ticket</span><span class="w-sa">sa</span>
        </div>
      </a>
      <div class="navbar__links">
        <a href="index.html">Browse Events</a>
        <a href="organiser.html" class="active">My Events</a>
      </div>
      <div class="navbar__actions">
        <!-- filled by auth.js -->
      </div>
      <button class="navbar__toggle" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="org-page section">
    <div class="container">

      <!-- Header -->
      <div class="org-header flex-between mb-xl">
        <div>
          <div class="section-label">Organiser Dashboard</div>
          <h1 class="section-title" id="orgWelcome">My Events</h1>
        </div>
        <button class="btn btn-primary" id="newEventBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create Event
        </button>
      </div>

      <!-- Stats row -->
      <div class="org-stats" id="orgStats">
        <div class="org-stat-card"><div class="org-stat-value" id="statTotal">—</div><div class="org-stat-label">Total Events</div></div>
        <div class="org-stat-card"><div class="org-stat-value" id="statPublished">—</div><div class="org-stat-label">Published</div></div>
        <div class="org-stat-card"><div class="org-stat-value" id="statPending">—</div><div class="org-stat-label">Pending Review</div></div>
      </div>

      <!-- Events table -->
      <div class="glass-card org-table-wrap">
        <div class="org-table-header flex-between">
          <h2 class="org-table-title">Your Events</h2>
          <div class="org-filter-row">
            <select class="form-select" id="statusFilter" style="width:140px;">
              <option value="">All Statuses</option>
              <option value="published">Published</option>
              <option value="pending">Pending</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
        </div>
        <div id="eventsTableBody">
          <div class="org-empty" id="orgLoading">
            <div class="spinner"></div>
            <p>Loading your events…</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ============ CREATE / EDIT EVENT MODAL ============ -->
  <div class="event-modal-overlay" id="eventModal">
    <div class="event-modal">
      <div class="event-modal__header">
        <h2 id="modalTitle">Create New Event</h2>
        <button class="auth-modal__close" id="closeEventModal" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="auth-error hidden" id="modalError"></div>

      <form id="eventForm" novalidate>
        <input type="hidden" id="editEventId"/>

        <div class="modal-grid-2">
          <div class="form-group" style="grid-column:1/-1;">
            <label class="form-label" for="evTitle">Event Title <span class="required">*</span></label>
            <input type="text" id="evTitle" class="form-input" placeholder="e.g. Cape Town Jazz Festival" required/>
          </div>

          <div class="form-group">
            <label class="form-label" for="evCategory">Category <span class="required">*</span></label>
            <select id="evCategory" class="form-select" required>
              <option value="">Select…</option>
              <option>Music</option><option>Technology</option><option>Food & Drink</option>
              <option>Sport</option><option>Arts & Culture</option><option>Business</option>
              <option>Comedy</option><option>Fashion</option><option>Other</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="evPrice">Base Price (R) <span class="required">*</span></label>
            <input type="number" id="evPrice" class="form-input" placeholder="0 for free" min="0" required/>
          </div>

          <div class="form-group">
            <label class="form-label" for="evDate">Date <span class="required">*</span></label>
            <input type="date" id="evDate" class="form-input" required/>
          </div>

          <div class="form-group">
            <label class="form-label" for="evTime">Start Time <span class="required">*</span></label>
            <input type="time" id="evTime" class="form-input" required/>
          </div>

          <div class="form-group">
            <label class="form-label" for="evEndTime">End Time</label>
            <input type="time" id="evEndTime" class="form-input"/>
          </div>

          <div class="form-group">
            <label class="form-label" for="evLocation">Venue / Location <span class="required">*</span></label>
            <input type="text" id="evLocation" class="form-input" placeholder="e.g. CTICC, Cape Town" required/>
          </div>

          <div class="form-group">
            <label class="form-label" for="evCity">City <span class="required">*</span></label>
            <input type="text" id="evCity" class="form-input" placeholder="Cape Town" required/>
          </div>

          <div class="form-group">
            <label class="form-label" for="evProvince">Province</label>
            <select id="evProvince" class="form-select">
              <option value="">Select…</option>
              <option>Western Cape</option><option>Gauteng</option><option>KwaZulu-Natal</option>
              <option>Eastern Cape</option><option>Limpopo</option><option>Mpumalanga</option>
              <option>North West</option><option>Free State</option><option>Northern Cape</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="evImage">Image URL</label>
            <input type="url" id="evImage" class="form-input" placeholder="https://…"/>
          </div>

          <div class="form-group" style="grid-column:1/-1;">
            <label class="form-label" for="evAddress">Full Address <span class="required">*</span></label>
            <input type="text" id="evAddress" class="form-input" placeholder="e.g. 1 Convention Square, Cape Town, 8001" required/>
          </div>

          <div class="form-group" style="grid-column:1/-1;">
            <label class="form-label">Payment Method</label>
            <div style="display:flex;gap:12px;margin-bottom:12px;">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                <input type="radio" name="evPayType" id="evPayTypeLink" value="link" checked/>
                <span>Payment Link</span>
              </label>
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                <input type="radio" name="evPayType" id="evPayTypeBank" value="bank"/>
                <span>Bank Transfer</span>
              </label>
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                <input type="radio" name="evPayType" id="evPayTypeFree" value="free"/>
                <span>Free Event</span>
              </label>
            </div>

            <div id="payLinkGroup">
              <label class="form-label" for="evPayLink">Payment Link (SnapScan, Yoco, etc.)</label>
              <input type="url" id="evPayLink" class="form-input" placeholder="https://yoco.com/pay/..."/>
            </div>

            <div id="payBankGroup" style="display:none;display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div class="form-group" style="margin:0">
                <label class="form-label" for="evBankName">Bank Name</label>
                <input type="text" id="evBankName" class="form-input" placeholder="e.g. FNB, Capitec"/>
              </div>
              <div class="form-group" style="margin:0">
                <label class="form-label" for="evAccountHolder">Account Holder</label>
                <input type="text" id="evAccountHolder" class="form-input" placeholder="e.g. Thabo Nkosi Events"/>
              </div>
              <div class="form-group" style="margin:0">
                <label class="form-label" for="evAccountNumber">Account Number</label>
                <input type="text" id="evAccountNumber" class="form-input" placeholder="e.g. 62345678910"/>
              </div>
              <div class="form-group" style="margin:0">
                <label class="form-label" for="evBranchCode">Branch Code</label>
                <input type="text" id="evBranchCode" class="form-input" placeholder="e.g. 250655"/>
              </div>
            </div>
          </div>

          <div class="form-group" style="grid-column:1/-1;">
            <label class="form-label" for="evDescription">Description <span class="required">*</span></label>
            <textarea id="evDescription" class="form-textarea" rows="4" placeholder="Describe your event…" required style="min-height:110px;"></textarea>
          </div>

          <div class="form-group" style="grid-column:1/-1;">
            <label class="form-label" for="evTags">Tags <span style="color:var(--text-muted);font-weight:400;">(comma separated)</span></label>
            <input type="text" id="evTags" class="form-input" placeholder="Music, Jazz, Adults"/>
          </div>
        </div>

        <!-- Ticket Types -->
        <div class="ticket-types-section">
          <div class="flex-between mb-md">
            <label class="form-label" style="margin:0;">Ticket Types</label>
            <button type="button" class="btn btn-secondary btn-sm" id="addTicketTypeBtn">+ Add Type</button>
          </div>
          <div id="ticketTypesContainer">
            <!-- Rows added dynamically -->
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelEventBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveEventBtn">
            <span id="saveBtnText">Create Event</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
<script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/organiser.js"></script>
</body>
</html>
