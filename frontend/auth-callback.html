<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TicketsSA Just a moment…</title>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#080808"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .cb-wrap { text-align:center; max-width:460px; width:100%; padding:0 24px; }
    .cb-logo { position:fixed; top:24px; left:50%; transform:translateX(-50%); font-size:1.25rem; font-weight:800; letter-spacing:-.02em; white-space:nowrap; text-decoration:none; }
    .cb-logo .w { color:#fff; } .cb-logo .g { color:var(--green); }
    .cb-icon { width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
    .cb-icon--loading { background:var(--bg-2); border:1px solid var(--b1); }
    .cb-icon--success { background:var(--green-tint); border:1px solid var(--green-border); color:var(--green); }
    .cb-icon--error   { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.25); color:#EF4444; }
    .cb-icon--reset   { background:rgba(59,130,246,.08); border:1px solid rgba(59,130,246,.25); color:var(--blue-hi,#60A5FA); }
    .cb-spinner { width:32px; height:32px; border:3px solid var(--b1); border-top-color:var(--green); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .cb-title { font-family:'Plus Jakarta Sans',sans-serif; font-size:clamp(1.5rem,4vw,2rem); font-weight:800; letter-spacing:-.03em; margin-bottom:12px; color:var(--text); }
    .cb-sub   { font-size:.9375rem; color:var(--text-2); line-height:1.65; margin-bottom:28px; }
    .cb-email-badge { display:inline-flex; align-items:center; gap:7px; background:var(--bg-2); border:1px solid var(--b1); border-radius:var(--rx,6px); padding:7px 16px; font-size:.875rem; font-weight:600; color:var(--green); margin-bottom:28px; }
    .cb-actions { display:flex; flex-direction:column; gap:12px; }
    .cb-reset-form { text-align:left; margin-top:24px; }
    .cb-reset-form .form-group { margin-bottom:16px; }
    .cb-strength { display:flex; gap:4px; margin-top:8px; }
    .cb-strength-bar { flex:1; height:4px; border-radius:2px; background:var(--b1); transition:background .3s; }
    .cb-strength-bar.weak   { background:#EF4444; }
    .cb-strength-bar.fair   { background:#F59E0B; }
    .cb-strength-bar.good   { background:#22C55E; }
    .cb-strength-bar.strong { background:#16A34A; }
    .cb-hint { font-size:.8rem; color:var(--text-3); margin-top:4px; display:block; }
    .cb-redirect-note { font-size:.8125rem; color:var(--text-3); margin-top:12px; }
  </style>
</head>
<body>

<a href="index.html" class="cb-logo">
  <span class="w">tickets</span><span class="g">sa</span>
</a>

<div class="cb-wrap" id="cbWrap">
  <div class="cb-icon cb-icon--loading"><div class="cb-spinner"></div></div>
  <h1 class="cb-title">Just a moment…</h1>
  <p class="cb-sub">Verifying your link.</p>
</div>

<script>
/* ================================================================
   auth-callback.html Supabase auth link handler  v2
   Handles:
     PKCE OAuth code  → ?code=…  (Google OAuth, etc.)
     Fragment tokens  → #access_token=…&type=…
       type=recovery  → password reset form
       type=signup / blank → auto-login + redirect
   ================================================================ */
(async () => {
  const SUPABASE_URL      = 'https://xaooupqqtbqwjddsqnwi.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhhb291cHFxdGJxd2pkZHNxbndpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzY1MDUsImV4cCI6MjA5NTgxMjUwNX0.ahG6OtWIfLnjqV0DLI_hRD0bh-IcbV14ok7SxIKH-qE';

  const TOKEN_KEY = 'mt_token';
  const USER_KEY  = 'mt_user';

  const wrap = document.getElementById('cbWrap');

  /* ── Helpers ────────────────────────────────────────── */
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function parseJwt(t) {
    try { return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }
    catch { return null; }
  }

  function formatUser(authUser) {
    const meta = authUser.user_metadata || {};
    const fullName = meta.full_name || meta.name || '';
    return {
      id:        authUser.id,
      email:     authUser.email,
      role:      authUser.app_metadata?.role || meta.role || 'attendee',
      firstName: meta.firstName || fullName.split(' ')[0] || '',
      lastName:  meta.lastName  || fullName.split(' ').slice(1).join(' ') || '',
      createdAt: authUser.created_at,
    };
  }

  function saveAndRedirect(session, authUser) {
    const user = formatUser(authUser);
    localStorage.setItem(TOKEN_KEY, session.access_token);
    localStorage.setItem(USER_KEY, JSON.stringify(user));
    history.replaceState(null, '', window.location.pathname);

    const dest = (user.role === 'organiser' || user.role === 'admin') ? 'dashboard.html' : 'index.html';
    const displayName = user.firstName || user.email?.split('@')[0] || 'there';

    wrap.innerHTML = `
      <div class="cb-icon cb-icon--success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="36" height="36"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1 class="cb-title">Signed in!</h1>
      <p class="cb-sub">Welcome, <strong style="color:var(--text)">${esc(displayName)}</strong>! Taking you to TicketsSA…</p>
      <p class="cb-redirect-note">Redirecting automatically…</p>`;

    // Determine if this is a brand-new account (created within last 2 minutes)
    const createdMs  = authUser.created_at ? new Date(authUser.created_at).getTime() : 0;
    const isNew      = createdMs > 0 && (Date.now() - createdMs) < 120_000;
    const provider   = authUser.app_metadata?.provider || 'email';

    fetch('/.netlify/functions/notify-signin', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email:     user.email,
        firstName: user.firstName || displayName,
        provider,
        isNew,
      }),
    }).catch(() => {}); // fire-and-forget don't block redirect

    setTimeout(() => { window.location.href = dest; }, 1800);
  }

  /* ── Load Supabase JS ───────────────────────────────── */
  async function loadSupabase() {
    if (window.supabase) return window.supabase;
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src    = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    return window.supabase;
  }

  /* ── Show: password reset form ──────────────────────── */
  function showPasswordReset(accessToken, refreshToken, email) {
    history.replaceState(null, '', window.location.pathname);
    wrap.innerHTML = `
      <div class="cb-icon cb-icon--reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="cb-title">Set New Password</h1>
      <p class="cb-sub">Enter a new password for <strong style="color:var(--text)">${esc(email||'your account')}</strong>.</p>
      <div class="cb-reset-form">
        <div class="form-group">
          <label class="form-label" for="newPw">New Password <span class="req">*</span></label>
          <div class="form-input-wrap">
            <input type="password" id="newPw" class="form-input" placeholder="At least 8 characters" autocomplete="new-password"/>
            <button type="button" class="form-pw-toggle" data-target="newPw" aria-label="Show password">
              <svg class="pw-eye pw-eye--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-eye pw-eye--hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="cb-strength" id="strengthBars">
            <div class="cb-strength-bar" id="s1"></div><div class="cb-strength-bar" id="s2"></div>
            <div class="cb-strength-bar" id="s3"></div><div class="cb-strength-bar" id="s4"></div>
          </div>
          <span class="cb-hint" id="strengthLabel">Enter a strong password</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPw">Confirm Password <span class="req">*</span></label>
          <div class="form-input-wrap">
            <input type="password" id="confirmPw" class="form-input" placeholder="Repeat your password" autocomplete="new-password"/>
            <button type="button" class="form-pw-toggle" data-target="confirmPw" aria-label="Show password">
              <svg class="pw-eye pw-eye--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-eye pw-eye--hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="form-error" id="confirmErr"></span>
        </div>
        <div class="form-error" id="resetErr" style="margin-bottom:12px"></div>
        <button class="btn btn-primary btn-lg btn-full" id="resetBtn">Set New Password</button>
      </div>`;

    // Strength meter
    document.getElementById('newPw').addEventListener('input', function() {
      const v = this.value; let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const lbls = ['','Weak','Fair','Good','Strong'];
      const cls  = ['','weak','fair','good','strong'];
      for (let i = 1; i <= 4; i++) {
        document.getElementById('s'+i).className = 'cb-strength-bar' + (i <= score ? ' '+cls[score] : '');
      }
      document.getElementById('strengthLabel').textContent = score > 0 ? lbls[score] : 'Enter a strong password';
    });

    // Password show/hide
    document.querySelectorAll('.form-pw-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const toText = input.type === 'password';
        input.type = toText ? 'text' : 'password';
        btn.querySelector('.pw-eye--show').style.display = toText ? 'none' : '';
        btn.querySelector('.pw-eye--hide').style.display = toText ? ''     : 'none';
      });
    });

    // Reset submit
    document.getElementById('resetBtn').addEventListener('click', async () => {
      const pw    = document.getElementById('newPw').value;
      const cpw   = document.getElementById('confirmPw').value;
      const errEl = document.getElementById('resetErr');
      const cfErr = document.getElementById('confirmErr');
      errEl.textContent = ''; errEl.classList.remove('visible');
      cfErr.textContent = ''; cfErr.classList.remove('visible');

      if (pw.length < 8)  { errEl.textContent = 'Password must be at least 8 characters.'; errEl.classList.add('visible'); return; }
      if (pw !== cpw)     { cfErr.textContent = 'Passwords do not match.'; cfErr.classList.add('visible'); return; }

      const btn = document.getElementById('resetBtn');
      btn.disabled = true; btn.textContent = 'Updating…';

      try {
        const sup = await loadSupabase();
        const sb  = sup.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken || '' });
        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) {
          errEl.textContent = error.message; errEl.classList.add('visible');
          btn.disabled = false; btn.textContent = 'Set New Password'; return;
        }
        wrap.innerHTML = `
          <div class="cb-icon cb-icon--success">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="36" height="36"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h1 class="cb-title">Password Updated!</h1>
          <p class="cb-sub">Your password has been changed successfully. Please log in with your new password.</p>
          <div class="cb-actions"><a href="index.html?login=1" class="btn btn-primary btn-lg">Log In</a></div>`;
      } catch (e) {
        errEl.textContent = 'Something went wrong. Please request a new reset link.';
        errEl.classList.add('visible');
        btn.disabled = false; btn.textContent = 'Set New Password';
      }
    });
  }

  /* ── Show: error ────────────────────────────────────── */
  function showLinkExpired() {
    wrap.innerHTML = `
      <div class="cb-icon cb-icon--error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <h1 class="cb-title">Link Expired</h1>
      <p class="cb-sub">This link has already been used or has expired. Please request a new one from the login page.</p>
      <div class="cb-actions"><a href="index.html" class="btn btn-primary btn-lg">Back to Home</a></div>`;
  }

  /* ── Show: email confirmed (manual login fallback) ──── */
  function showConfirmedManual(email, name) {
    history.replaceState(null, '', window.location.pathname);
    wrap.innerHTML = `
      <div class="cb-icon cb-icon--success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="36" height="36"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1 class="cb-title">Email Confirmed!</h1>
      <p class="cb-sub">${name ? `Welcome, <strong style="color:var(--text)">${esc(name)}</strong>!<br>` : ''}Your email has been verified. You can now log in.</p>
      ${email ? `<div class="cb-email-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>${esc(email)}</div>` : ''}
      <div class="cb-actions">
        <a href="index.html?login=1${email ? '&email='+encodeURIComponent(email) : ''}" class="btn btn-primary btn-lg">Log In to TicketsSA</a>
        <a href="index.html" class="btn btn-secondary btn-lg">Browse Events</a>
      </div>`;
  }

  /* ════════════════════════════════════════════════
     MAIN FLOW
  ════════════════════════════════════════════════ */

  /* ── 1. PKCE OAuth code exchange (?code=…) ───────── */
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');

  if (code) {
    try {
      const sup = await loadSupabase();
      const sb  = sup.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data, error } = await sb.auth.exchangeCodeForSession(code);
      if (error || !data.session) { showLinkExpired(); return; }
      saveAndRedirect(data.session, data.user);
    } catch (_) { showLinkExpired(); }
    return;
  }

  /* ── 2. Fragment token flow (#access_token=…) ────── */
  const hash   = window.location.hash.slice(1);
  const params = Object.fromEntries(hash.split('&').map(p => {
    const [k, ...v] = p.split('=');
    return [decodeURIComponent(k), decodeURIComponent(v.join('='))];
  }));

  if (!params.access_token) { showLinkExpired(); return; }

  const payload = parseJwt(params.access_token);
  const email   = payload?.email || '';
  const name    = payload?.user_metadata?.firstName || payload?.user_metadata?.full_name || '';
  const type    = params.type || '';

  /* ── 2a. Password recovery ───────────────────────── */
  if (type === 'recovery') {
    showPasswordReset(params.access_token, params.refresh_token, email);
    return;
  }

  /* ── 2b. Signup / OAuth auto-login ─────────────── */
  try {
    const sup = await loadSupabase();
    const sb  = sup.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sb.auth.setSession({
      access_token:  params.access_token,
      refresh_token: params.refresh_token || '',
    });
    if (error || !data.session) {
      showConfirmedManual(email, name); return;
    }
    saveAndRedirect(data.session, data.user);
  } catch (_) {
    showConfirmedManual(email, name);
  }

})();
</script>
</body>
</html>
