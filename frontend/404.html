<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found TicketsSA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟</text></svg>"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    .notfound-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px var(--pad);
      background: var(--bg-page);
      position: relative;
      overflow: hidden;
    }
    .notfound-page::before {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(22,163,74,.05) 0%, transparent 70%);
      pointer-events: none;
    }
    .notfound-code {
      font-family: 'Sora', sans-serif;
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #16A34A, #3B82F6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      letter-spacing: -0.05em;
    }
    .notfound-title {
      font-family: 'Sora', sans-serif;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    .notfound-desc {
      font-size: 1rem;
      color: #A1A1AA;
      max-width: 380px;
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .notfound-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="notfound-page">
    <div class="notfound-code">404</div>
    <h1 class="notfound-title">This page doesn't exist</h1>
    <p class="notfound-desc">
      The page you're looking for may have been moved, deleted, or never existed.
    </p>
    <div class="notfound-actions">
      <a href="index.html" class="btn btn-primary btn-lg">Back to Home</a>
      <a href="browse.html" class="btn btn-secondary btn-lg">Browse Events</a>
    </div>
  </div>
</body>
</html>
