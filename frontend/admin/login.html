<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login TicketsSA</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
    /* ── Page layout ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0B0B0B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'DM Sans', -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Subtle background glow */
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(22,163,74,.07) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -200px; right: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(59,130,246,.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Card ── */
    .login-card {
      background: #161616;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 80px rgba(0,0,0,.7);
    }

    /* Blue accent stripe */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #3B82F6, #1D4ED8);
      border-radius: 20px 20px 0 0;
    }

    /* ── Logo ── */
    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .login-logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #3B82F6, #1D4ED8);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      box-shadow: 0 0 14px rgba(59,130,246,.4);
    }

    .login-logo-text {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -.03em;
    }
    .login-logo-text .g { color: #16A34A; }
    .login-logo-text .w { color: #fff; }

    .login-subtitle {
      font-size: .8125rem;
      color: #52525B;
      margin-bottom: 28px;
      margin-left: 46px;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* ── Heading ── */
    .login-heading {
      font-family: 'Sora', sans-serif;
      font-size: 1.375rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.025em;
      margin-bottom: 6px;
    }

    .login-desc {
      font-size: .875rem;
      color: #71717A;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    /* ── Form ── */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: .875rem;
      font-weight: 600;
      color: #A1A1AA;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: #141414;
      border: 1.5px solid rgba(255,255,255,.09);
      border-radius: 10px;
      font-size: .9375rem;
      font-family: inherit;
      color: #fff;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .form-input::placeholder { color: #3F3F46; }

    .form-input:hover { border-color: rgba(255,255,255,.15); }

    .form-input:focus {
      border-color: #16A34A;
      box-shadow: 0 0 0 3px rgba(22,163,74,.15);
    }

    /* ── Button ── */
    .btn-login {
      width: 100%;
      padding: 13px;
      background: #16A34A;
      color: #fff;
      border: none;
      border-radius: 99px;
      font-family: 'Sora', sans-serif;
      font-size: .9375rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: all .25s cubic-bezier(.34,1.56,.64,1);
      letter-spacing: .01em;
    }

    .btn-login:hover:not(:disabled) {
      background: #22C55E;
      box-shadow: 0 0 28px rgba(22,163,74,.4);
      transform: translateY(-1px) scale(1.01);
    }

    .btn-login:active:not(:disabled) { transform: scale(.98); }

    .btn-login:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Error ── */
    .login-error {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .875rem;
      color: #EF4444;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }

    .login-error.visible { display: block; }

    /* ── Back link ── */
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: .875rem;
      color: #52525B;
      text-decoration: none;
      transition: color .2s;
    }

    .back-link:hover { color: #A1A1AA; }

    /* ── Turnstile CAPTCHA ── */
    .admin-recaptcha-wrap {
      display: flex;
      justify-content: center;
      margin: 4px 0 16px;
      min-height: 78px;
    }
  </style>
</head>
<body>

  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon">🎟</div>
      <div class="login-logo-text">
        <span class="w">tickets</span><span class="g">sa</span>
      </div>
    </div>
    <div class="login-subtitle">Admin Portal</div>

    <!-- Heading -->
    <h1 class="login-heading">Welcome back</h1>
    <p class="login-desc">Sign in with your admin credentials to manage events, users and tickets.</p>

    <!-- Error -->
    <div class="login-error" id="loginError" role="alert"></div>

    <!-- Form -->
    <form id="adminLoginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="adminEmail">Email Address</label>
        <input
          type="email"
          id="adminEmail"
          class="form-input"
          placeholder="admin@TicketsSA.co.za"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="adminPassword">Password</label>
        <input
          type="password"
          id="adminPassword"
          class="form-input"
          placeholder="Your password"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="admin-recaptcha-wrap" id="rcAdminWrap">
        <div id="rcAdmin"></div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Sign In to Admin Portal
      </button>
    </form>

  </div>

  <a href="../index.html" class="back-link">← Back to TicketsSA</a>

  <script>
    // ── Resolve API base URL ─────────────────────────────────────────────
    // Works whether opened via the Node server (http://localhost:5500)
    // or directly as a file (file://) always points to port 5500.
    const API_BASE = (function () {
      // file:// protocol → always point to local backend
      if (window.location.protocol === 'file:') return 'http://localhost:5500';
      // Served from any real server (local dev, Netlify, etc.) → use relative URLs
      return '';
    })();

    // ── Check if already logged in as admin ─────────────────────────────
    (function () {
      try {
        const user  = JSON.parse(localStorage.getItem('mt_user') || 'null');
        const token = localStorage.getItem('mt_token');
        if (user && token && user.role === 'admin') {
          window.location.href = API_BASE + '/admin/index.html';
        }
      } catch { /* ignore */ }
    })();

    // ── Firebase config keep in sync with frontend/js/auth.js ──────────
    const firebaseConfig = {
      apiKey:            'YOUR_FIREBASE_API_KEY',
      authDomain:        'tickets-sa.firebaseapp.com',
      projectId:         'tickets-sa',
      storageBucket:     'tickets-sa.appspot.com',
      messagingSenderId: 'YOUR_FIREBASE_SENDER_ID',
      appId:             'YOUR_FIREBASE_APP_ID',
    };
    const FIREBASE_SDK_VERSION = '10.13.2';

    // ── Cloudflare Turnstile CAPTCHA verified server-side by
    //    verify-turnstile.js — Firebase Auth has no built-in captchaToken
    //    passthrough the way Supabase did. ──────────────────────────────
    const TURNSTILE_SITE_KEY = '0x4AAAAAADrXDvUXgmgxhbAx';
    const RC_ENABLED = TURNSTILE_SITE_KEY && !TURNSTILE_SITE_KEY.startsWith('YOUR_');
    let _rcWidget = null;
    let _rcReady  = false; // true only while a fresh, unused token is available

    function _updateSubmitState() {
      const btn = document.getElementById('loginBtn');
      if (btn) btn.disabled = RC_ENABLED && !_rcReady;
    }

    function _initTurnstile() {
      if (!RC_ENABLED) return;
      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=_renderTurnstile';
      s.async = true; s.defer = true;
      document.head.appendChild(s);
    }

    window._renderTurnstile = function () {
      if (!RC_ENABLED || !window.turnstile) return;
      const el = document.getElementById('rcAdmin');
      if (el && _rcWidget === null) {
        _rcWidget = window.turnstile.render('#rcAdmin', {
          sitekey: TURNSTILE_SITE_KEY,
          theme: 'dark',
          callback:         () => { _rcReady = true;  _updateSubmitState(); },
          'expired-callback': () => { _rcReady = false; _updateSubmitState(); },
          'error-callback':   () => { _rcReady = false; _updateSubmitState(); },
        });
      }
    };

    function _getRcToken() {
      if (!RC_ENABLED) return null;
      try { return window.turnstile?.getResponse(_rcWidget) || null; } catch { return null; }
    }

    function _resetRc() {
      if (!RC_ENABLED) return;
      try { window.turnstile?.reset(_rcWidget); } catch { /* ignore */ }
      _rcReady = false;
      _updateSubmitState();
    }

    if (!RC_ENABLED) document.getElementById('rcAdminWrap').style.display = 'none';
    else _initTurnstile();

    _updateSubmitState(); // disables submit up front when RC_ENABLED, until solved

    function _loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    let _fbReady = null;
    async function getFirebase() {
      if (_fbReady) return _fbReady;
      if (!window.firebase) {
        await _loadScript(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-app-compat.js`);
        await Promise.all([
          _loadScript(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-auth-compat.js`),
          _loadScript(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-firestore-compat.js`),
        ]);
      }
      if (!window.firebase.apps.length) window.firebase.initializeApp(firebaseConfig);
      _fbReady = window.firebase;
      return _fbReady;
    }

    async function verifyTurnstile(token) {
      try {
        const res = await fetch('/.netlify/functions/verify-turnstile', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        if (!res.ok) return false;
        const data = await res.json();
        return !!data.success;
      } catch { return false; }
    }

    // ── Login form submit ────────────────────────────────────────────────
    document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const btn     = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');
      const email   = document.getElementById('adminEmail').value.trim();
      const pass    = document.getElementById('adminPassword').value;

      errorEl.textContent    = '';
      errorEl.style.display  = 'none';

      if (!email || !pass) {
        errorEl.textContent   = 'Please enter your email and password.';
        errorEl.style.display = 'block';
        return;
      }

      const captchaToken = _getRcToken();
      if (RC_ENABLED && !captchaToken) {
        errorEl.textContent   = 'Please complete the CAPTCHA check.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Signing in…';

      try {
        if (RC_ENABLED && !(await verifyTurnstile(captchaToken))) {
          _resetRc();
          errorEl.textContent   = 'CAPTCHA check failed. Please try again.';
          errorEl.style.display = 'block';
          _updateSubmitState();
          btn.textContent = 'Sign In to Admin Portal';
          return;
        }

        const fb   = await getFirebase();
        const cred = await fb.auth().signInWithEmailAndPassword(email, pass);
        const idTokenResult = await cred.user.getIdTokenResult();
        const role = idTokenResult.claims.role || 'attendee';

        if (role !== 'admin') {
          await fb.auth().signOut();
          _resetRc();
          errorEl.textContent   = 'This portal is for admin accounts only.';
          errorEl.style.display = 'block';
          _updateSubmitState();
          btn.textContent = 'Sign In to Admin Portal';
          return;
        }

        let profile = {};
        try {
          const snap = await fb.firestore().collection('users').doc(cred.user.uid).get();
          if (snap.exists) profile = snap.data() || {};
        } catch { /* best-effort */ }

        localStorage.setItem('mt_token', idTokenResult.token);
        localStorage.setItem('mt_user', JSON.stringify({
          id: cred.user.uid, email: cred.user.email, role,
          firstName: profile.firstName || '',
          lastName:  profile.lastName  || '',
        }));

        btn.textContent = 'Success! Redirecting…';
        window.location.href = 'index.html';

      } catch (err) {
        _resetRc();
        errorEl.textContent   = err && err.code === 'auth/invalid-credential'
          ? 'Incorrect email or password.'
          : 'Authentication service unavailable. Please try again.';
        errorEl.style.display = 'block';
        _updateSubmitState();
        btn.textContent = 'Sign In to Admin Portal';
      }
    });

    document.getElementById('adminEmail').focus();
  </script>

</body>
</html>
