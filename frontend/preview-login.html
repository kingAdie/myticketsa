<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Preview Mode (local only) · TicketsSA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/marketplace.css"/>
  <style>
    .pv{max-width:720px;margin:0 auto;padding:48px 20px 80px}
    .pv__badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;
      border-radius:var(--rx);background:rgba(234,179,8,.12);color:#EAB308;
      border:1px solid rgba(234,179,8,.3);font-size:.6875rem;font-weight:800;
      letter-spacing:.08em;text-transform:uppercase}
    .pv__title{margin-top:14px;font-family:'Plus Jakarta Sans',sans-serif;
      font-size:clamp(1.75rem,5vw,2.25rem);font-weight:800;letter-spacing:-.03em;color:var(--text)}
    .pv__sub{margin-top:12px;font-size:1rem;color:var(--text-2);line-height:1.7}
    .pv__roles{display:grid;grid-template-columns:1fr;gap:12px;margin:28px 0}
    @media(min-width:640px){.pv__roles{grid-template-columns:repeat(3,1fr)}}
    .pv__role{display:flex;flex-direction:column;gap:6px;padding:18px;text-align:left;
      background:var(--bg-2);border:1.5px solid var(--b1);border-radius:var(--r3);
      cursor:pointer;transition:border-color .2s,background .2s;font-family:inherit;color:inherit}
    .pv__role:hover{border-color:var(--green);background:var(--green-tint)}
    .pv__role:disabled{opacity:.5;cursor:wait}
    .pv__role-icon{font-size:1.5rem}
    .pv__role-name{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
      font-size:1rem;color:var(--text)}
    .pv__role-desc{font-size:.8125rem;color:var(--text-2);line-height:1.55}
    .pv__current{padding:14px 16px;border-radius:var(--r3);margin-bottom:24px;
      background:var(--green-tint);border:1px solid var(--green-border);
      font-size:.9375rem;color:var(--text)}
    .pv__links{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
    .pv__blocked{padding:24px;border-radius:var(--r4);background:var(--bg-2);
      border:1px solid rgba(239,68,68,.4)}
    .pv__error{padding:14px 16px;border-radius:var(--r3);margin-bottom:20px;
      background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);
      font-size:.875rem;color:#EF4444}
  </style>
</head>
<body>

<div class="pv" id="root"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script>
/* ============================================================
   LOCAL PREVIEW MODE

   Firebase ID tokens are cryptographically signed, so they can't
   be faked client-side the way the old Supabase-era version of
   this page did. This now performs a REAL Firebase sign-in
   against three seeded test accounts (one per role) — that means
   it grants genuine access, same as signing in normally would for
   those accounts, just without re-typing a password every time.

   You need to create these three accounts once (Firebase Console
   → Authentication → Users → Add user, using the emails/passwords
   below), and promote the admin one via scripts/bootstrap-admin.js.

   Hard-gated to localhost. On ticketssa.co.za this page refuses
   to run (and Netlify has no rewrite for it, so it 404s anyway).
   ============================================================ */

var firebaseConfig = {
  apiKey:            'AIzaSyBG0O0MIOGa_8X1H-xUS1mz9r41TateJBE',
  authDomain:        'tickets-sa.firebaseapp.com',
  projectId:         'tickets-sa',
  storageBucket:     'tickets-sa.firebasestorage.app',
  messagingSenderId: '1033978636742',
  appId:             '1:1033978636742:web:ea98ebe89d6daf3ce32ac7',
};
var FIREBASE_SDK_VERSION = '10.13.2';

var HOST = window.location.hostname;
var IS_LOCAL = HOST === 'localhost' || HOST === '127.0.0.1' || HOST === '::1' || HOST === '';

var root = document.getElementById('root');

/* Seed test accounts — create these once in the Firebase Console.
   Passwords are dev-only placeholders; change them to whatever you
   actually set. Never used outside IS_LOCAL. */
var ROLES = {
  seller: {
    icon: '🎪', name: 'Seller', desc: 'Seller Hub, My Listings, all five creation wizards.',
    email: 'preview.seller@ticketssa.co.za', password: 'preview-seller-devpw',
  },
  customer: {
    icon: '🎟️', name: 'Customer', desc: 'My TicketsSA — tickets, bookings and requests.',
    email: 'preview.buyer@ticketssa.co.za', password: 'preview-buyer-devpw',
  },
  admin: {
    icon: '🛡️', name: 'Admin', desc: 'Admin portal navigation and layout.',
    email: 'preview.admin@ticketssa.co.za', password: 'preview-admin-devpw',
  }
};

function loadScript(src) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

var _fbReady = null;
function getFirebase() {
  if (_fbReady) return _fbReady;
  _fbReady = (window.firebase ? Promise.resolve() :
    loadScript('https://www.gstatic.com/firebasejs/' + FIREBASE_SDK_VERSION + '/firebase-app-compat.js').then(function () {
      return Promise.all([
        loadScript('https://www.gstatic.com/firebasejs/' + FIREBASE_SDK_VERSION + '/firebase-auth-compat.js'),
        loadScript('https://www.gstatic.com/firebasejs/' + FIREBASE_SDK_VERSION + '/firebase-firestore-compat.js'),
      ]);
    })
  ).then(function () {
    if (!window.firebase.apps.length) window.firebase.initializeApp(firebaseConfig);
    return window.firebase;
  });
  return _fbReady;
}

function currentUser() {
  try { return JSON.parse(localStorage.getItem('mt_user')); } catch (e) { return null; }
}

function enter(key, btn) {
  var r = ROLES[key];
  var errBox = document.getElementById('pvError');
  if (errBox) errBox.remove();
  if (btn) { btn.disabled = true; }

  getFirebase().then(function (fb) {
    return fb.auth().signInWithEmailAndPassword(r.email, r.password).then(function (cred) {
      return cred.user.getIdTokenResult().then(function (idTokenResult) {
        return fb.firestore().collection('users').doc(cred.user.uid).get().then(function (snap) {
          var profile = snap.exists ? snap.data() : {};
          localStorage.setItem('mt_token', idTokenResult.token);
          localStorage.setItem('mt_user', JSON.stringify({
            id: cred.user.uid, email: cred.user.email,
            role: idTokenResult.claims.role || 'attendee',
            firstName: profile.firstName || 'Preview',
            lastName:  profile.lastName  || r.name,
            organisationName: profile.organisationName || null,
          }));
          render();
        });
      });
    });
  }).catch(function (err) {
    render();
    var box = document.createElement('div');
    box.className = 'pv__error'; box.id = 'pvError';
    box.textContent = 'Could not sign in as ' + r.name + ': ' + (err.message || err) +
      ' — has this seed account been created in the Firebase Console yet?';
    root.insertBefore(box, root.firstChild.nextSibling);
  });
}

function leave() {
  getFirebase().then(function (fb) { fb.auth().signOut(); }).catch(function () {});
  localStorage.removeItem('mt_user');
  localStorage.removeItem('mt_token');
  render();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  if (!IS_LOCAL) {
    root.innerHTML =
      '<div class="pv__blocked">' +
        '<div class="pv__title" style="font-size:1.5rem">Preview mode is disabled here</div>' +
        '<p class="pv__sub">This page only runs on localhost. Sign in normally instead.</p>' +
        '<div class="pv__links"><a class="btn btn-primary" href="index.html">Go to TicketsSA</a></div>' +
      '</div>';
    return;
  }

  var u = currentUser();
  var active = u
    ? '<div class="pv__current">Currently signed in as <strong>' + esc(u.firstName + ' ' + u.lastName) +
      '</strong> — role <strong>' + esc(u.role) + '</strong>.' +
      '<div class="pv__links">' +
        (u.role === 'attendee'
          ? '<a class="btn btn-primary btn-sm" href="my-tickets.html">My TicketsSA</a>' +
            '<a class="btn btn-secondary btn-sm" href="sell.html">Sell page</a>'
          : '<a class="btn btn-primary btn-sm" href="dashboard.html">Seller Hub</a>' +
            '<a class="btn btn-secondary btn-sm" href="create-listing.html">Create Listing</a>' +
            '<a class="btn btn-secondary btn-sm" href="organiser.html">My Events</a>') +
        (u.role === 'admin' ? '<a class="btn btn-secondary btn-sm" href="admin/index.html">Admin portal</a>' : '') +
        '<button class="btn btn-ghost btn-sm" onclick="leave()">Sign out</button>' +
      '</div></div>'
    : '';

  root.innerHTML =
    '<span class="pv__badge">Local preview only</span>' +
    '<h1 class="pv__title">Preview the signed-in screens</h1>' +
    '<p class="pv__sub">Signs in for real, against seeded Firebase test accounts (see the comment at the top of ' +
      'this file for their emails). Faster than typing credentials and solving a CAPTCHA every time, but this is ' +
      'a genuine session, not a fake one — create the three accounts once in the Firebase Console, and run ' +
      '<code>scripts/bootstrap-admin.js</code> once for the admin one.</p>' +
    active +
    '<div class="pv__roles">' +
      Object.keys(ROLES).map(function (k) {
        var r = ROLES[k];
        return '<button class="pv__role" onclick="enter(\'' + k + '\', this)">' +
          '<span class="pv__role-icon">' + r.icon + '</span>' +
          '<span class="pv__role-name">Sign in as ' + esc(r.name) + '</span>' +
          '<span class="pv__role-desc">' + esc(r.desc) + '</span>' +
        '</button>';
      }).join('') +
    '</div>';
}

render();
</script>
</body>
</html>
