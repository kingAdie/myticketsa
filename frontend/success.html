<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="robots" content="noindex"/>
<title>Your Ticket | TicketsSA</title>
<script>
  // Old booking links pointed here. Tickets now live on ticket.html.
  (function () {
    var p = new URLSearchParams(location.search);
    var id = p.get('ticket') || p.get('id') || '';
    location.replace('ticket.html' + (id ? '?id=' + encodeURIComponent(id) : ''));
  })();
</script>
</head><body><p><a href="ticket.html">Open your ticket</a></p></body></html>
