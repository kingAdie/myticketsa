<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8"/>
  <!-- Served at /event.html and at the short link /e/<slug>: resolve files from the site root. -->
  <base href="/"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event · TicketsSA</title>
  <meta name="description" content="Event details and tickets on TicketsSA."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟</text></svg>"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
  <link rel="stylesheet" href="css/buy.css"/>
  <link rel="stylesheet" href="css/phone.css"/>
</head>
<body class="buy">

<!-- ═══════════ NAVBAR ═══════════ -->
<nav class="navbar" id="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="navbar__logo">
      <div class="navbar__logo-wordmark">
        <span class="w">tickets</span><span class="g">sa</span>
      </div>
    </a>

    <nav class="navbar__cats" id="navCats" aria-label="Browse categories">
      <a class="navbar__cat" href="browse.html"><span class="cat-icon">🎟</span><span class="cat-label">Events</span></a>
      <a class="navbar__cat" href="accommodations.html"><span class="cat-icon">🏨</span><span class="cat-label">Stays</span></a>
      <a class="navbar__cat" href="browse.html?category=Travel%20%26%20Tours"><span class="cat-icon">🌍</span><span class="cat-label">Experiences</span></a>
      <a class="navbar__cat" href="book.html"><span class="cat-icon">🧑‍🍳</span><span class="cat-label">Services</span></a>
      <a class="navbar__cat" href="services/index.html"><span class="cat-icon">🔊</span><span class="cat-label">Equipment</span></a>
      <a class="navbar__cat" href="index.html#merch"><span class="cat-icon">🛍</span><span class="cat-label">Merch</span></a>
    </nav>

    <div class="navbar__actions" id="navbarActions"></div>
    <button class="navbar__toggle" id="mobileToggle" aria-label="Open menu">
      <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</nav>

<main class="ep" id="epMain">

  <!-- Poster: the whole picture, never cropped -->
  <div class="ep-poster" id="epPoster">
    <div class="sk"></div>
    <img class="ep-poster__bg" id="posterBg" alt="" aria-hidden="true"/>
    <img class="ep-poster__img" id="bannerImage" alt=""/>
    <a class="ep-back" href="browse.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>Events</a>
    <button class="ep-share" id="shareEventBtn" type="button" aria-label="Share this event">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
    </button>
  </div>

  <!-- Title, the facts, and the tickets -->
  <section class="ep-card" id="tickets">
    <span class="ep-chip" id="eventCategory">Event</span>
    <h1 class="ep-title" id="eventTitle"><span class="sk"></span></h1>
    <span class="sr-only" id="breadcrumbTitle"></span>

    <div class="ep-facts">
      <div class="ep-fact">
        <span class="ep-fact__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        <div><b id="eventDate"><span class="sk"></span></b><span id="eventTime"></span></div>
      </div>
      <div class="ep-fact">
        <span class="ep-fact__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
        <div><b id="eventLocation"><span class="sk"></span></b><span id="eventCity"></span><a class="ep-map" id="eventMap" href="#" target="_blank" rel="noopener" hidden>Open in Maps</a></div>
      </div>
      <div class="ep-fact">
        <span class="ep-fact__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <div><b id="eventOrganiser"><span class="sk"></span></b><span>Organiser</span></div>
      </div>
    </div>

    <h2 class="ep-h">Choose your tickets</h2>
    <div class="tt-list" id="ticketTypes" role="radiogroup" aria-label="Ticket types">
      <div class="sk" style="height:64px"></div>
    </div>

    <div class="ep-buy">
      <button class="btn btn-primary" id="buyTicketBtn" disabled>Choose a ticket</button>
    </div>
    <div class="ep-steps" aria-label="How it works">
      <span><i>1</i>Reserve</span><span><i>2</i>Pay the organiser</span><span><i>3</i>Get your QR ticket</span>
    </div>
  </section>

  <!-- About -->
  <div class="ep-about">
    <section class="ep-block">
      <h2 class="ep-h">About this event</h2>
      <div class="ep-desc" id="eventDescription"></div>
      <button class="ep-more" id="descMore" type="button" hidden>Read more</button>
      <div class="ep-tags" id="eventTags"></div>
    </section>
    <section class="ep-block" id="refundSection" hidden>
      <h2 class="ep-h">Cancellations &amp; refunds</h2>
      <div class="ep-desc" id="eventRefund"></div>
      <p class="ep-small">Set by the organiser. TicketsSA does not take payment. <a href="refunds.html">How refunds work</a></p>
    </section>
  </div>
</main>

<!-- Phones: always one tap from buying -->
<div class="buybar" id="buybar">
  <div class="buybar__info"><b id="barPrice">&nbsp;</b><span id="barSub">Tickets</span></div>
  <button class="btn btn-primary" id="barBtn" type="button">Get tickets</button>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/event.js"></script>
<script>
  Auth.updateNavbar();
  window.addEventListener('scroll', function () {
    document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });
</script>
<script>
  document.getElementById('shareEventBtn')?.addEventListener('click', function () {
    var t = (document.getElementById('eventTitle') || {}).textContent || 'Event';
    Utils.shareLink(window.__eventLink || location.href.split('#')[0], t.trim() + ' | TicketsSA');
  });
</script>
</body>
</html>
