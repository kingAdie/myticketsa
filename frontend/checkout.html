<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout TicketsSA</title>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#080808"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟</text></svg>"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
  <link rel="stylesheet" href="css/buy.css"/>
</head>
<body class="buy co-page">

<!-- ═══════════ NAVBAR ═══════════ -->
<nav class="navbar" id="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="navbar__logo">
      <div class="navbar__logo-wordmark">
        <span class="w">tickets</span><span class="g">sa</span>
      </div>
    </a>
    <nav class="navbar__cats" id="navCats" aria-label="Browse categories">
      <a class="navbar__cat" href="browse.html"><span class="cat-icon">🎟</span><span class="cat-label">Events</span></a>
      <a class="navbar__cat" href="accommodations.html"><span class="cat-icon">🏨</span><span class="cat-label">Stays</span></a>
      <a class="navbar__cat" href="browse.html?category=Travel%20%26%20Tours"><span class="cat-icon">🌍</span><span class="cat-label">Experiences</span></a>
      <a class="navbar__cat" href="services/index.html"><span class="cat-icon">🔊</span><span class="cat-label">Equipment</span></a>
      <a class="navbar__cat" href="index.html#merch"><span class="cat-icon">🛍</span><span class="cat-label">Merch</span></a>
    </nav>
    <div class="navbar__actions" id="navbarActions"></div>
    <button class="navbar__toggle" id="mobileToggle" aria-label="Open menu">
      <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</nav>


<main class="co">
  <a href="browse.html" id="backToEventLink" class="co-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>Back to event
  </a>

  <!-- What you are getting -->
  <div class="co-order">
    <div class="co-order__img"><img id="summaryImage" alt="" onerror="this.remove()"/></div>
    <div class="co-order__main">
      <b id="summaryEventTitle">—</b>
      <span id="summaryDate"></span><span id="summaryLocation"></span>
      <div class="co-order__tix"><em id="summaryTicketType">—</em><strong id="summaryTotal">—</strong></div>
    </div>
  </div>

  <form id="checkoutForm" novalidate>
    <section class="co-card">
      <h2>Your details</h2>
      <p>Your ticket is sent to this email.</p>
      <div class="co-fields">
        <div class="co-two">
          <div class="form-group">
            <label class="form-label" for="firstName">First name</label>
            <input class="form-input" id="firstName" name="firstName" required autocomplete="given-name" placeholder="Thabo"/>
            <span class="form-error" id="firstNameError"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="lastName">Last name</label>
            <input class="form-input" id="lastName" name="lastName" required autocomplete="family-name" placeholder="Nkosi"/>
            <span class="form-error" id="lastNameError"></span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" required autocomplete="email" inputmode="email" placeholder="you@email.com"/>
          <span class="form-error" id="emailError"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone <small>(optional)</small></label>
          <input class="form-input" type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="082 123 4567"/>
        </div>
      </div>
    </section>

    <section class="co-card" id="payCard">
      <div class="co-pay" id="paymentMethodBox"></div>
    </section>

    <label class="co-check"><input type="checkbox" id="optinCheck"/><span>Tell me about new events near me. You can unsubscribe any time.</span></label>
    <p class="co-login" id="loginHint" hidden>Have an account? <button type="button" id="loginHintBtn">Log in</button> to save this ticket to it.</p>

    <div class="co-submitbar">
      <button type="submit" class="btn btn-primary co-submit" id="confirmBtn">Reserve my ticket</button>
      <p class="co-terms">By continuing you agree to the <a href="terms.html" target="_blank" rel="noopener">Terms</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>. Refunds follow the organiser's policy.</p>
    </div>
  </form>
</main>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/checkout.js"></script>
<script>
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 10);
}, { passive: true });
</script>
</body>
</html>
