<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟</text></svg>"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
  <link rel="stylesheet" href="css/hub.css"/>
  <link rel="stylesheet" href="css/phone.css"/>
</head>
<body>

<!-- ═══════════ NAVBAR ═══════════ -->

  <div class="container navbar__inner">
    <a href="index.html" class="navbar__logo">
      <div class="navbar__logo-wordmark">
        <span class="w">tickets</span><span class="g">sa</span>
      </div>
    </a>

    <nav class="navbar__cats" id="navCats" aria-label="Browse categories">
      <a class="navbar__cat" href="browse.html"><span class="cat-icon">🎟</span><span class="cat-label">Events</span></a>
      <a class="navbar__cat" href="accommodations.html"><span class="cat-icon">🏨</span><span class="cat-label">Stays</span></a>
      <a class="navbar__cat" href="browse.html?category=Travel%20%26%20Tours"><span class="cat-icon">🌍</span><span class="cat-label">Experiences</span></a>
      <a class="navbar__cat" href="book.html"><span class="cat-icon">🧑‍🍳</span><span class="cat-label">Services</span></a>
      <a class="navbar__cat" href="services/index.html"><span class="cat-icon">🔊</span><span class="cat-label">Equipment</span></a>
      <a class="navbar__cat" href="index.html#merch"><span class="cat-icon">🛍</span><span class="cat-label">Merch</span></a>
    </nav>

    <div class="navbar__actions" id="navbarActions"></div>
    <button class="navbar__toggle" id="mobileToggle" aria-label="Open menu">
      <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</nav>



<main class="hub hub--narrow">
  <header class="hub-head">
    <div>
      <p class="hub-hello">Your account</p>
      <h1>My profile</h1>
    </div>
  </header>

  <form class="hub-card acct" id="acctForm" novalidate>
    <div class="acct__avatar" id="acctAvatar">?</div>
    <div class="acct__grid">
      <label>First name<input id="acFirst" autocomplete="given-name" required/></label>
      <label>Last name<input id="acLast" autocomplete="family-name"/></label>
      <label class="acct__full">Seller or organisation name <small>Optional. Shown on your listings, e.g. your company or brand.</small><input id="acOrg" autocomplete="organization"/></label>
      <label class="acct__full">Email <small>Your sign-in email. Bookings and tickets are sent here.</small><input id="acEmail" disabled/></label>
    </div>
    <p class="acct__err" id="acErr" role="alert"></p>
    <div class="acct__acts">
      <button class="btn btn-primary" type="submit" id="acSave">Save changes</button>
    </div>
  </form>

  <div class="hub-links">
    <a class="hub-link" href="my-tickets.html"><span>🎟</span><b>My tickets &amp; bookings</b><em>→</em></a>
    <a class="hub-link" href="dashboard.html"><span>📊</span><b>Seller Hub</b><em>→</em></a>
    <button class="hub-link" type="button" id="acLogout"><span>↩</span><b>Sign out</b><em></em></button>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  Auth.updateNavbar(); Utils.initMobileNav();
  if (!Auth.isLoggedIn()) { Auth.requireAuth(function () { location.reload(); }, 'Sign in to see your profile', 'login'); return; }
  var u = Auth.getUser() || {};
  var $ = function (id) { return document.getElementById(id); };
  function paint(x) {
    $('acFirst').value = x.firstName || ''; $('acLast').value = x.lastName || '';
    $('acOrg').value = x.organisationName || ''; $('acEmail').value = x.email || '';
    $('acctAvatar').textContent = ((x.firstName || x.email || '?').trim().charAt(0) || '?').toUpperCase();
  }
  paint(u);
  $('acLogout').addEventListener('click', function () { Auth.logout(); });
  $('acctForm').addEventListener('submit', async function (e) {
    e.preventDefault(); $('acErr').textContent = '';
    var b = $('acSave'); b.disabled = true; b.textContent = 'Saving…';
    try {
      var fresh = await Auth.updateMyProfile({ firstName: $('acFirst').value, lastName: $('acLast').value, organisationName: $('acOrg').value });
      paint(fresh); Utils.showToast('Profile saved.', 'success');
    } catch (err) { $('acErr').textContent = err.message || 'Could not save. Please try again.'; }
    b.disabled = false; b.textContent = 'Save changes';
  });
});
</script>
</body>
</html>
