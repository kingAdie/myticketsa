  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="container navbar__inner">
      <a href="index.html" class="navbar__logo">
        <div class="navbar__logo-wordmark">
          <span class="w-ticket">tickets</span><span class="w-sa">sa</span>
        </div>
      </a>
    <nav class="navbar__cats" id="navCats" aria-label="Browse categories">
      <a class="navbar__cat" href="browse.html"><span class="cat-icon">🎟</span><span class="cat-label">Events</span></a>
      <a class="navbar__cat" href="accommodations.html"><span class="cat-icon">🏨</span><span class="cat-label">Stays</span></a>
      <a class="navbar__cat" href="browse.html?category=Travel%20%26%20Tours"><span class="cat-icon">🌍</span><span class="cat-label">Experiences</span></a>

      <div class="navbar__actions">

      </div>
      <button class="navbar__toggle" id="mobileToggle" aria-label="Open menu">
        <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="org-page section">
    <div class="container">

      <!-- Header -->
      <div class="org-header flex-between mb-xl">
        <div>
          <div class="section-label">Organiser Dashboard</div>
          <h1 class="section-title" id="orgWelcome">My Events</h1>
        </div>
        <a class="btn btn-primary" href="create-listing.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create Listing
        </a>
      </div>

      <!-- Stats row -->
      <div class="org-stats" id="orgStats">
        <div class="org-stat-card"><div class="org-stat-value" id="statTotal">—</div><div class="org-stat-label">Total Events</div></div>
        <div class="org-stat-card"><div class="org-stat-value" id="statPublished">—</div><div class="org-stat-label">Published</div></div>
        <div class="org-stat-card"><div class="org-stat-value" id="statPending">—</div><div class="org-stat-label">Pending Review</div></div>
      </div>

      <!-- Events table -->
      <div class="glass-card org-table-wrap">
        <div class="org-table-header flex-between">
          <h2 class="org-table-title">Your Events</h2>
          <div class="org-filter-row">
            <select class="form-select" id="statusFilter" style="width:140px;">
              <option value="">All Statuses</option>
              <option value="published">Published</option>
              <option value="pending">Pending</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
        </div>
        <div id="eventsTableBody">
          <div class="org-empty" id="orgLoading">
            <div class="spinner"></div>
            <p>Loading your events…</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ============ CREATE / EDIT EVENT MODAL ============ -->

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/organiser.js"></script>
